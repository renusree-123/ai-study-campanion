version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ai-study-companion
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - DATABASE_URL=file:./data/dev.db
      - AUTH_SECRET=${AUTH_SECRET:-Zfe6YQZi1rEfSbPd6aLD+P6GE+4W973KgqeNPBE8yqtMinKHSkD/A0wd1BIwYC2K}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - WORKER_IN_PROCESS=true
      - STORAGE_DIR=./storage
      - MAX_UPLOAD_MB=20
      - LOG_LEVEL=info
    volumes:
      # Persistent storage for SQLite database
      - sqlite_data:/app/data
      # Persistent storage for uploaded PDF materials
      - app_storage:/app/storage
    restart: unless-stopped

volumes:
  sqlite_data:
  app_storage:
